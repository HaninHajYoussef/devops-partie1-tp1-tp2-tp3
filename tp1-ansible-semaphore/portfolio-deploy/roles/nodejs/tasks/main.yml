---
- name: Ajouter le dépôt NodeSource
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: nodesource_repo

- name: Mettre à jour le cache apt après l'ajout du dépôt
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 300
  when: nodesource_repo.changed

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    lock_timeout: 300

- name: Installer PM2 globalement
  ansible.builtin.command: npm install -g pm2
  args:
    creates: /usr/bin/pm2
