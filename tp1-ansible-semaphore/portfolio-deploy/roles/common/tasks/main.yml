---
- name: Mettre à jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - acl
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    lock_timeout: 300

- name: Créer l'utilisateur de déploiement
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
    state: present
